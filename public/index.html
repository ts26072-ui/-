<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.json">
<title>익명방</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --sub: #6b7280;
    --accent: #4f46e5; --line: #e5e7eb; --bubble: #ffffff; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --card: #1f2937; --text: #f9fafb; --sub: #9ca3af;
            --accent: #818cf8; --line: #374151; --bubble: #1f2937; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  /* 시작 화면 */
  #home { align-items: center; justify-content: center; padding: 24px; gap: 14px; text-align: center; }
  #home h1 { margin: 0; font-size: 28px; }
  #home p { margin: 0; color: var(--sub); line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
  button, input { font: inherit; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  input.code { border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 12px; padding: 12px; text-align: center; letter-spacing: 4px; text-transform: uppercase; font-size: 18px; }
  .rules { font-size: 13px; color: var(--sub); text-align: left; line-height: 1.7; }
  .rules b { color: var(--text); }
  #err { color: var(--danger); font-size: 13px; min-height: 18px; }

  /* 채팅 화면 */
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 700; }
  header .meta { font-size: 12px; color: var(--sub); }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #banner { background: #fef3c7; color: #92400e; font-size: 12px; padding: 7px 14px; }
  @media (prefers-color-scheme: dark) { #banner { background: #422006; color: #fcd34d; } }
  #list { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; background: var(--bubble); border: 1px solid var(--line); border-radius: 14px;
    padding: 9px 12px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; position: relative; }
  .msg .time { display: block; font-size: 11px; color: var(--sub); margin-top: 3px; }
  .msg.hidden { color: var(--sub); font-style: italic; background: transparent; }
  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .actions button { background: none; border: 0; padding: 0; font-size: 11px; color: var(--sub); cursor: pointer; text-decoration: underline; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  form input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 11px 16px; }
  form .btn { border-radius: 999px; padding: 11px 18px; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #111827; color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>

<section id="home" class="screen active">
  <h1>🫥 익명방</h1>
  <p>닉네임도, 프로필도 없어요.<br>누가 썼는지 몰라도 편하게 이야기해요.</p>

  <div class="card">
    <button class="btn" id="create">새 방 만들기</button>
    <div style="color:var(--sub);font-size:13px">또는 친구가 알려준 코드로 입장</div>
    <input class="code" id="code" maxlength="5" placeholder="코드 5자리" autocomplete="off">
    <button class="btn ghost" id="join">입장하기</button>
    <div id="err"></div>
  </div>

  <div class="card rules">
    <b>이 방의 약속</b><br>
    · 특정인의 이름·학교·반 등을 거론하며 험담하지 않기<br>
    · 놀림, 따돌림, 협박, 개인정보 올리기 금지<br>
    · 고민, 일상, 웃긴 얘기, 응원은 대환영<br>
    · 불편한 글은 <b>신고</b> — 3명이 신고하면 자동으로 가려져요
  </div>
</section>

<section id="chat" class="screen">
  <header>
    <div>
      <div class="title">방 코드 <span id="roomCode"></span></div>
      <div class="meta"><span id="count">1</span>명 접속 중 · <span id="role"></span></div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="chip" id="share">코드 복사</button>
      <button class="chip" id="leave">나가기</button>
    </div>
  </header>
  <div id="banner">특정인을 저격하는 글은 신고해 주세요. 대화는 서버에 오래 저장되지 않아요.</div>
  <div id="list"></div>
  <form id="form">
    <input id="text" maxlength="500" placeholder="메시지 입력" autocomplete="off">
    <button class="btn" type="submit">전송</button>
  </form>
</section>

<div id="toast"></div>

<script>
// 웹으로 접속하면 같은 서버를 자동으로 씁니다.
// APK(Capacitor)는 capacitor.config.json 의 server.url 로 접속하므로 별도 설정이 필요 없어요.
const API = window.ANON_CHAT_BASE || '';

const $ = (id) => document.getElementById(id);
let es = null, cid = null, isHost = false, hostToken = null, currentCode = null, reported = new Set();

async function post(path, body) {
  try {
    const r = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok && data.error) toast(data.error);
    return r.ok ? data : null;
  } catch {
    toast('서버에 연결할 수 없어요.');
    return null;
  }
}

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
}
function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
}
function fmt(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

function connect(code, token) {
  $('err').textContent = '';
  if (es) es.close();
  hostToken = token || null;
  let opened = false;
  es = new EventSource(API + '/api/events?code=' + encodeURIComponent(code) + '&hostToken=' + encodeURIComponent(token || ''));
  es.onmessage = (e) => { opened = true; handle(JSON.parse(e.data)); };
  es.onerror = () => {
    if (!opened) {
      es.close();
      $('err').textContent = '입장할 수 없어요. 코드를 확인하거나 잠시 후 다시 시도해 주세요.';
    } else if ($('chat').classList.contains('active')) {
      toast('연결이 끊겼어요. 다시 연결하는 중…');
    }
  };
}

function handle(m) {
  if (m.type === 'joined') {
    cid = m.cid;
    currentCode = m.code;
    isHost = m.isHost;
    if (!isHost) hostToken = null;
    $('roomCode').textContent = m.code;
    $('role').textContent = isHost ? '방장' : '참여자';
    $('list').innerHTML = '';
    m.messages.forEach(render);
    show('chat');
    scrollDown();
    return;
  }
  if (m.type === 'count') { $('count').textContent = m.count; return; }
  if (m.type === 'chat') { render(m.message); scrollDown(); return; }
  if (m.type === 'update') { render(m.message); return; }
}

function render(msg) {
  let el = document.querySelector('[data-id="' + msg.id + '"]');
  if (!el) {
    el = document.createElement('div');
    el.dataset.id = msg.id;
    $('list').appendChild(el);
  }
  el.className = 'msg' + (msg.hidden ? ' hidden' : '');
  el.innerHTML = '';
  if (msg.hidden) {
    el.textContent = '가려진 메시지예요.';
    return;
  }
  const body = document.createElement('div');
  body.textContent = msg.text; // textContent 사용: HTML 삽입 방지
  const time = document.createElement('span');
  time.className = 'time'; time.textContent = fmt(msg.ts);
  const actions = document.createElement('div');
  actions.className = 'actions';
  const rep = document.createElement('button');
  rep.textContent = '신고';
  rep.onclick = () => {
    if (reported.has(msg.id)) return toast('이미 신고했어요.');
    reported.add(msg.id);
    post('/api/report', { cid, id: msg.id }).then((r) => { if (r) toast('신고가 접수됐어요.'); });
  };
  actions.appendChild(rep);
  if (isHost) {
    const del = document.createElement('button');
    del.textContent = '삭제';
    del.onclick = () => post('/api/delete', { cid, id: msg.id, hostToken });
    actions.appendChild(del);
  }
  el.append(body, time, actions);
}

function scrollDown() { const l = $('list'); l.scrollTop = l.scrollHeight; }

$('create').onclick = async () => {
  const r = await post('/api/create', {});
  if (!r) { $('err').textContent = '서버에 연결할 수 없어요.'; return; }
  try { localStorage.setItem('host_' + r.code, r.hostToken); } catch {}
  connect(r.code, r.hostToken);
};
$('join').onclick = () => {
  const code = $('code').value.trim().toUpperCase();
  if (code.length !== 5) { $('err').textContent = '코드는 5자리예요.'; return; }
  let token = null;
  try { token = localStorage.getItem('host_' + code); } catch {}
  connect(code, token);
};
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const t = $('text').value.trim();
  if (!t || !cid) return;
  $('text').value = '';
  const r = await post('/api/chat', { cid, text: t });
  if (!r) $('text').value = t; // 실패하면 입력한 내용을 되돌려 놔요
};
$('leave').onclick = () => { if (es) es.close(); es = null; cid = null; reported = new Set(); show('home'); };
$('share').onclick = async () => {
  try { await navigator.clipboard.writeText(currentCode); toast('코드를 복사했어요.'); }
  catch { toast('코드: ' + currentCode); }
};
</script>
</body>
</html>
