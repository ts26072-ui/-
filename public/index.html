<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="익명방">
<link rel="manifest" href="manifest.json">
<title>익명방</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --sub: #6b7280; --accent: #4f46e5;
    --line: #e5e7eb; --bubble: #ffffff; --mine: #e0e7ff; --danger: #dc2626; --warn-bg: #fef3c7; --warn: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --card: #1f2937; --text: #f9fafb; --sub: #9ca3af; --accent: #818cf8;
            --line: #374151; --bubble: #1f2937; --mine: #312e81; --danger: #f87171; --warn-bg: #422006; --warn: #fcd34d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 15px; }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  #app { display: flex; flex-direction: column; height: 100dvh; }
  main { flex: 1; position: relative; min-height: 0; }
  .tab { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  .tab.active { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* 상단바 / 하단 탭 */
  .top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: var(--card); border-bottom: 1px solid var(--line); min-height: 52px; }
  .top .title { font-weight: 700; flex: 1; }
  .top .meta { font-size: 12px; color: var(--sub); font-weight: 400; }
  nav { display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; padding: 8px 0 7px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; font-size: 11px; color: var(--sub); cursor: pointer; position: relative; }
  nav button .ic { font-size: 20px; line-height: 1; }
  nav button.on { color: var(--accent); font-weight: 700; }
  .badge { position: absolute; top: 3px; left: 54%; background: var(--danger); color: #fff; border-radius: 999px;
    min-width: 17px; padding: 1px 5px; font-size: 10px; font-weight: 700; }

  /* 버튼 */
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 6px 12px; font-size: 13px; border-radius: 999px; }
  .btn:disabled { opacity: .5; }
  .lnk { background: none; border: 0; padding: 0; color: var(--sub); font-size: 12px; text-decoration: underline; cursor: pointer; }
  .lnk.adm { color: var(--danger); }
  .icon { background: none; border: 0; font-size: 20px; padding: 4px 6px; cursor: pointer; }
  .input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 13px; }
  textarea.input { resize: none; min-height: 130px; line-height: 1.5; }

  /* 채팅 */
  #chatList, #dmMsgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
  .msg { max-width: 84%; align-self: flex-start; background: var(--bubble); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 12px; word-break: break-word; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-color: transparent; }
  .msg.gone { background: transparent; border-style: dashed; }
  .msg .txt { white-space: pre-wrap; line-height: 1.5; }
  .msg .ph { color: var(--sub); font-style: italic; font-size: 13px; }
  .msg .meta { display: flex; gap: 10px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--sub); flex-wrap: wrap; }
  .media { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 5px; background: #000; }
  .composer { display: flex; gap: 8px; align-items: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .composer input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 10px 15px; min-width: 0; }
  .composer .btn { border-radius: 999px; padding: 10px 16px; }
  .pending { display: flex; gap: 10px; align-items: center; padding: 6px 14px; background: var(--card); border-top: 1px solid var(--line); font-size: 13px; color: var(--sub); }
  .upstat { font-size: 12px; color: var(--accent); padding: 0 14px 4px; background: var(--card); }
  .banner { background: var(--warn-bg); color: var(--warn); font-size: 12px; padding: 7px 14px; }

  /* 게시판 (디시 스타일) */
  .seg { display: flex; gap: 6px; padding: 10px 12px; background: var(--card); border-bottom: 1px solid var(--line); align-items: center; }
  .seg .chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer; }
  .seg .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .seg .sp { flex: 1; }
  .prow { display: grid; grid-template-columns: 44px 1fr; gap: 0 8px; padding: 10px 12px; background: var(--card); border-bottom: 1px solid var(--line); cursor: pointer; }
  .prow .no { grid-row: span 2; color: var(--sub); font-size: 12px; align-self: center; text-align: center; }
  .prow .tt { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .cc { color: var(--accent); font-weight: 700; }
  .prow .sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 14px; color: var(--sub); font-size: 13px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 20px; line-height: 1.7; }
  .post { background: var(--card); padding: 14px; border-bottom: 1px solid var(--line); }
  .post h2 { margin: 0 0 6px; font-size: 18px; line-height: 1.4; word-break: break-word; }
  .post .info { font-size: 12px; color: var(--sub); margin-bottom: 12px; }
  .post .body { white-space: pre-wrap; line-height: 1.65; word-break: break-word; }
  .post .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .cmts h3 { margin: 0; padding: 12px 14px 6px; font-size: 14px; }
  .cmt { padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
  .cmt .who { font-size: 12px; color: var(--sub); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cmt .ct { margin-top: 3px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .cmt.gone .ct { color: var(--sub); font-style: italic; }
  .cform { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .cform input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 10px 15px; min-width: 0; }
  .wform { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
  .thumb { position: relative; width: 78px; height: 78px; border-radius: 10px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.65); color: #fff; border: 0; border-radius: 999px; width: 22px; height: 22px; font-size: 13px; cursor: pointer; }

  /* 1:1 */
  .trow { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--line); cursor: pointer; }
  .trow .av { width: 40px; height: 40px; border-radius: 50%; background: var(--mine); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .trow .tx { flex: 1; min-width: 0; }
  .trow .t1 { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .trow .t2 { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .dot { background: var(--danger); color: #fff; border-radius: 999px; min-width: 18px; padding: 1px 6px; font-size: 11px; font-weight: 700; text-align: center; }
  .tag { font-size: 11px; background: var(--line); color: var(--sub); border-radius: 999px; padding: 1px 8px; font-weight: 500; }
  .reqbox { margin: 12px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; line-height: 1.6; }
  .reqbox .row { display: flex; gap: 8px; margin-top: 10px; }

  /* 설정 */
  .sec { margin: 12px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; line-height: 1.7; }
  .sec h3 { margin: 0 0 6px; font-size: 15px; }
  .sec ul { margin: 0; padding-left: 18px; color: var(--sub); font-size: 14px; }
  .sec .row { display: flex; gap: 8px; margin-top: 8px; }
  .rep { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 13px; }
  .rep .lines { max-height: 160px; overflow-y: auto; margin: 6px 0; color: var(--sub); white-space: pre-wrap; }

  /* 겹침 화면 */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #lightbox img { max-width: 100%; max-height: 100%; }
  #rules { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40; }
  #rules .box { background: var(--card); border-radius: 18px; padding: 22px; max-width: 380px; line-height: 1.7; }
  #rules h2 { margin: 0 0 8px; }
  #rules ul { padding-left: 18px; margin: 8px 0 16px; color: var(--sub); }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #111827; color: #fff; padding: 9px 15px;
    border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90%; text-align: center; }
  #toast.show { opacity: .96; }
</style>
</head>
<body>
<div id="app">
  <main>
    <!-- 채팅 -->
    <section id="tab-chat" class="tab active">
      <div class="top"><div class="title">🫥 익명방 <span class="meta">· <span id="online">0</span>명 접속 중</span></div></div>
      <div class="banner">특정인을 저격하거나 사진·영상으로 괴롭히는 글은 신고해 주세요. 3명이 신고하면 자동으로 가려져요.</div>
      <div id="chatList"></div>
      <div class="upstat" id="upstat" hidden></div>
      <div class="pending" id="pending" hidden></div>
      <form class="composer" id="chatForm">
        <button type="button" class="icon" id="attach" aria-label="사진/영상 첨부">📎</button>
        <input id="chatText" maxlength="500" placeholder="메시지 입력" autocomplete="off">
        <button class="btn" type="submit">전송</button>
      </form>
    </section>

    <!-- 게시판 -->
    <section id="tab-board" class="tab">
      <div class="top">
        <button class="icon" id="bBack" hidden aria-label="뒤로">←</button>
        <div class="title" id="bTitle">게시판</div>
        <button class="icon" id="bRefresh" aria-label="새로고침">↻</button>
        <button class="btn small" id="bWrite">글쓰기</button>
      </div>
      <div class="scroll" id="boardBody"></div>
      <form class="cform" id="cform" hidden>
        <input id="cText" maxlength="300" placeholder="댓글 입력" autocomplete="off">
        <button class="btn small" type="submit">등록</button>
      </form>
    </section>

    <!-- 1:1 -->
    <section id="tab-dm" class="tab">
      <div class="top">
        <button class="icon" id="dBack" hidden aria-label="뒤로">←</button>
        <div class="title" id="dTitle">1:1 대화</div>
        <button class="lnk" id="dBlock" hidden>차단</button>
        <button class="lnk" id="dReport" hidden>신고</button>
      </div>
      <div class="scroll" id="dmBody"></div>
      <div id="dmChat" style="flex:1;display:none;flex-direction:column;min-height:0">
        <div id="dmMsgs"></div>
        <div class="pending" id="dPending" hidden></div>
        <div class="upstat" id="dUpstat" hidden></div>
        <form class="composer" id="dForm">
          <button type="button" class="icon" id="dAttach" aria-label="사진/영상 첨부">📎</button>
          <input id="dText" maxlength="1000" placeholder="메시지 입력" autocomplete="off">
          <button class="btn" type="submit">전송</button>
        </form>
      </div>
    </section>

    <!-- 설정 -->
    <section id="tab-me" class="tab">
      <div class="top"><div class="title">설정</div></div>
      <div class="scroll" id="meBody"></div>
    </section>
  </main>

  <nav>
    <button data-tab="chat" class="on"><span class="ic">💬</span>채팅<span class="badge" id="bgChat" hidden></span></button>
    <button data-tab="board"><span class="ic">📋</span>게시판</button>
    <button data-tab="dm"><span class="ic">✉️</span>1:1<span class="badge" id="bgDm" hidden></span></button>
    <button data-tab="me"><span class="ic">⚙️</span>설정</button>
  </nav>
</div>

<input type="file" id="file" accept="image/*,video/*" hidden>

<div id="rules" hidden>
  <div class="box">
    <h2>🫥 이 방의 약속</h2>
    <div>닉네임 없이 편하게 이야기하는 곳이에요.</div>
    <ul>
      <li>특정인의 이름·학교·반을 거론한 험담, 놀림, 따돌림 금지</li>
      <li>남의 사진·영상, 개인정보를 올리지 않기</li>
      <li>불편한 글은 <b>신고</b>. 3명이 신고하면 자동으로 가려져요</li>
      <li>1:1은 상대가 수락해야 시작되고, 언제든 차단·신고할 수 있어요</li>
    </ul>
    <button class="btn" id="rulesOk" style="width:100%">알겠어요</button>
  </div>
</div>
<div id="lightbox" hidden></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
// 웹으로 접속하면 같은 서버를 자동으로 씁니다. (APK는 capacitor.config.json 의 server.url 로 접속)
const API = window.ANON_CHAT_BASE || '';
const $ = (id) => document.getElementById(id);
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const rnd = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');

// 이 기기의 익명 ID: 서버 안에서만 쓰이고 다른 사람에게는 전달되지 않아요.
let uid = LS.get('uid');
if (!/^[a-f0-9]{32}$/.test(uid || '')) { uid = rnd(16); LS.set('uid', uid); }
let adminKey = LS.get('adminKey') || '';
let isAdmin = false, adminEnabled = false, curTab = 'chat';

// ───────── 공통 도구 ─────────
function toast(t) {
  const el = $('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
function fmt(ts) {
  const d = new Date(ts), n = new Date(), p = (x) => String(x).padStart(2, '0');
  return d.toDateString() === n.toDateString() ? p(d.getHours()) + ':' + p(d.getMinutes()) : p(d.getMonth() + 1) + '.' + p(d.getDate());
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c); }
  return e;
}
// 배열/null이 섞여 있어도 안전하게 내용을 교체
function fill(el, ...kids) { el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false)); }
async function api(method, path, body) {
  try {
    const r = await fetch(API + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-uid': uid, 'x-admin': encodeURIComponent(adminKey) },
      body: method === 'GET' ? undefined : JSON.stringify(body || {}),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { toast(data.error || '오류가 발생했어요.'); return null; }
    return data;
  } catch { toast('서버에 연결할 수 없어요.'); return null; }
}
function uploadFile(file, statEl) {
  return new Promise((resolve) => {
    const isVid = file.type.startsWith('video/'), isImg = file.type.startsWith('image/');
    if (!isVid && !isImg) { toast('사진이나 영상만 올릴 수 있어요.'); return resolve(null); }
    if (file.size > (isVid ? 40 : 10) * 1024 * 1024) { toast(isVid ? '영상은 40MB까지예요.' : '사진은 10MB까지예요.'); return resolve(null); }
    const say = (t) => { if (statEl) { statEl.hidden = !t; statEl.textContent = t || ''; } };
    const x = new XMLHttpRequest();
    x.open('POST', API + '/api/upload');
    x.setRequestHeader('Content-Type', file.type);
    x.setRequestHeader('x-uid', uid);
    x.upload.onprogress = (e) => { if (e.lengthComputable) say('업로드 중… ' + Math.round(e.loaded / e.total * 100) + '%'); };
    x.onload = () => {
      say('');
      let d = {}; try { d = JSON.parse(x.responseText); } catch {}
      if (x.status === 200) resolve(d); else { toast(d.error || '업로드에 실패했어요.'); resolve(null); }
    };
    x.onerror = () => { say(''); toast('업로드에 실패했어요.'); resolve(null); };
    say('업로드 중… 0%');
    x.send(file);
  });
}
function mediaEl(m, onload) {
  if (!m) return null;
  if (m.kind === 'video') return h('video', { src: API + m.url, controls: true, playsinline: true, preload: 'metadata', class: 'media', onloadedmetadata: onload });
  return h('img', { src: API + m.url, class: 'media', loading: 'lazy', onload, onclick: () => lightbox(m) });
}
function lightbox(m) {
  const box = $('lightbox');
  box.replaceChildren(h('img', { src: API + m.url }));
  box.hidden = false;
  box.onclick = () => { box.hidden = true; box.replaceChildren(); };
}
const btn = (label, fn, cls) => h('button', { class: cls || 'lnk', type: 'button', onclick: fn, text: label });

// 파일 선택창 하나를 여러 곳에서 공유
function pickFile(cb) {
  const f = $('file');
  f.onchange = () => { const file = f.files[0]; f.value = ''; if (file) cb(file); };
  f.click();
}

// ───────── 탭 ─────────
function showTab(name) {
  curTab = name;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.id === 'tab-' + name));
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'chat') { unseen = 0; setBadge('bgChat', 0); scrollChat(true); }
  if (name === 'board' && bview === 'list') boardList();
  if (name === 'dm') { loadDMs(); }
  if (name === 'me') renderMe();
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
function setBadge(id, n) { const el = $(id); el.hidden = !n; el.textContent = n > 99 ? '99+' : n; }

// ───────── 신고 / 관리자 동작 / 1:1 요청 ─────────
async function report(kind, id, postId) {
  if (!confirm('이 내용을 신고할까요?')) return;
  const r = await api('POST', '/api/report', { kind, id, postId });
  if (r) toast('신고가 접수됐어요.');
}
async function requestDM(kind, id, postId) {
  if (!confirm('이 사람에게 1:1 대화를 요청할까요?\n\n· 상대는 내가 누구인지 알 수 없어요.\n· 상대가 수락해야 대화가 시작돼요.\n· 거절해도 나에게는 알려지지 않아요.')) return;
  const r = await api('POST', '/api/dm/request', { kind, id, postId });
  if (r) toast('요청을 보냈어요. 수락하면 1:1 탭에 대화가 열려요.');
}
async function adminDo(action, kind, id, postId) {

function handle(m) {
  switch (m.type) {
    case 'hello':
      adminEnabled = m.adminEnabled;
      resetChat();
      m.mine.forEach((id) => mine.add(id));
      m.messages.forEach(renderMsg);
      scrollChat(true);
      $('online').textContent = m.online;
      if (m.banned) toast('이 기기는 글쓰기가 제한돼 있어요.');
      loadDMs();
      break;
    case 'chat': {
      renderMsg(m.message);
      if (curTab !== 'chat' && !(m.message.n && sentNonce.has(m.message.n))) { unseen++; setBadge('bgChat', unseen); }
      break;
    }
    case 'update': renderMsg(m.message); break;
    case 'count': $('online').textContent = m.count; break;
    case 'room_reset': resetChat(); toast('방이 새로 열렸어요.'); break;
    case 'dm':
      if (m.kind === 'request') toast('누군가 1:1 대화를 요청했어요.');
      loadDMs();
      break;
  }
}
function connect() {
  const es = new EventSource(API + '/api/events?uid=' + uid);
  es.onmessage = (e) => handle(JSON.parse(e.data));
}

// ───────── 시작 ─────────
if (!LS.get('rulesOK')) $('rules').hidden = false;
$('rulesOk').onclick = () => { LS.set('rulesOK', '1'); $('rules').hidden = true; };
(async () => { if (adminKey) await adminCheck(false); connect(); })();
})();
</script>
